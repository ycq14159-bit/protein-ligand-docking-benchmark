  spatial_prescreen_angstrom: 6.0
  severe_clash_upper_exclusive_angstrom: 2.0
  contact_lower_inclusive_angstrom: 2.0
  vdw_margin_angstrom: 0.5
  minimum_atomic_contacts_per_binding_residue: 2
  minimum_binding_residues_per_supported_chain: 2
  vdw_source_cpp: /root/autodl-tmp/reproduction/03_reference_data/biolip2_figshare/extracted/mmCIF2BioLiP-master/script/cif2pdb.cpp
  vdw_source_function: make_vdw
  vdw_source_version: biolip2_figshare_frozen_source

connection_audit:
  source: raw_mmcif_struct_conn_read_only
  covalent_conn_type: covale
  metal_conn_type: metalc
  require_same_assembly_model: true
  require_operator_compatibility: true

runtime:
  workers: 8
  resume: true
  task_granularity: processing_2_partition
  parquet_compression: zstd

policy:
  plip_affects_membership: false
  arpeggio_executed: false
  prolif_executed: false
  docking_executed: false

