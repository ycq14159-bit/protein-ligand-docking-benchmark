stage:
  name: processing_03_direct_contact_qualification
  version: 1.0.0
  schema_version: processing_3_schema_v1.0.0

input:
  processing_1_index: /root/autodl-tmp/benchmark_1.0/processing_1_pdb_source_audit/release/processing_1_mmcif_index.tsv.gz
  processing_2_run: /root/autodl-tmp/benchmark_1.0/processing_2_assembly_ready_structure_preparation/runs/20260810_full_01
  auxiliary_build: /root/autodl-tmp/benchmark_1.0/auxiliary_entry_work_packages/builds/20260805_full_01/output
  expected_strict_ligand_placements: 995804
  expected_active_receptor_chain_instances: 834548
  expected_ready_receptor_chain_instances: 834222

contact:
